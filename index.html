  <body>
    <!-- Cards can be added, removed or reordered. --wide spans both columns.

            </a>

                <video
                  class="mfa-work__video"
                  data-mfa-src="https://assets.mixkit.co/videos/39875/39875-720.mp4"
                  muted
                  loop
                  playsinline
